[package]
name = "cilo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Lossless, deduplicating archives for collections of game builds"
license = "MIT"

[dependencies]
anyhow = "1.0"
bincode = "1.3.3"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fastcdc = "3.2"
filetime = "0.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
walkdir = "2.5"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
